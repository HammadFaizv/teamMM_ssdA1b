services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gigtask_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gigtask_db"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/gigtask_db
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: gigtask_db
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      FRONTEND_API_URL: http://localhost:3000/api
    ports:
      - "127.0.0.1:5173:5173"
volumes:
  postgres_data:
  mongo_data:
