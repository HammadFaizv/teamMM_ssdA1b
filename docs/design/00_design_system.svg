<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1890 1580" width="1890" height="1580" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1890" height="1580" fill="#dcdcd3"/><text x="40" y="52" font-size="20" font-weight="700" fill="#0d0d0d">Design system · colours, type, components</text><g transform="translate(40,70)"><rect width="1440" height="1470" fill="#f6f6f2"/><rect x="0" y="0" width="1440" height="1470" rx="0" fill="#f6f6f2" /><text x="58" y="90" font-size="56" font-weight="300" fill="#0d0d0d" text-anchor="start" letter-spacing="-2">GigTask design system</text><text x="58" y="128" font-size="16" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Inter · 2 px black borders · beige panels · pink and lime accents</text><text x="58" y="190" font-size="13" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="2">COLOUR</text><rect x="58" y="206" width="128" height="92" rx="0" fill="#f6f6f2" stroke="#0d0d0d" stroke-width="2" /><text x="58" y="322" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Paper</text><text x="58" y="342" font-size="12" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">#f6f6f2</text><rect x="204" y="206" width="128" height="92" rx="0" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="2" /><text x="204" y="322" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Ink</text><text x="204" y="342" font-size="12" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">#0d0d0d</text><rect x="350" y="206" width="128" height="92" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="350" y="322" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Beige</text><text x="350" y="342" font-size="12" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">#efe6d1</text><rect x="496" y="206" width="128" height="92" rx="0" fill="#e4d8bb" stroke="#0d0d0d" stroke-width="2" /><text x="496" y="322" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Beige deep</text><text x="496" y="342" font-size="12" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">#e4d8bb</text><rect x="642" y="206" width="128" height="92" rx="0" fill="#e8e8e1" stroke="#0d0d0d" stroke-width="2" /><text x="642" y="322" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Stone</text><text x="642" y="342" font-size="12" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">#e8e8e1</text><rect x="788" y="206" width="128" height="92" rx="0" fill="#c8f53c" stroke="#0d0d0d" stroke-width="2" /><text x="788" y="322" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Lime</text><text x="788" y="342" font-size="12" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">#c8f53c</text><rect x="934" y="206" width="128" height="92" rx="0" fill="#f2336b" stroke="#0d0d0d" stroke-width="2" /><text x="934" y="322" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Pink</text><text x="934" y="342" font-size="12" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">#f2336b</text><rect x="1080" y="206" width="128" height="92" rx="0" fill="#ffd9e4" stroke="#0d0d0d" stroke-width="2" /><text x="1080" y="322" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Pink soft</text><text x="1080" y="342" font-size="12" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">#ffd9e4</text><rect x="1226" y="206" width="128" height="92" rx="0" fill="#a10f3e" stroke="#0d0d0d" stroke-width="2" /><text x="1226" y="322" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Pink deep</text><text x="1226" y="342" font-size="12" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">#a10f3e</text><text x="58" y="410" font-size="13" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="2">TYPE</text><text x="58" y="490" font-size="76" font-weight="300" fill="#0d0d0d" text-anchor="start" letter-spacing="-3">Page title 76 / 300</text><text x="58" y="544" font-size="30" font-weight="500" fill="#0d0d0d" text-anchor="start" letter-spacing="-0.5">Section heading 30 / 500</text><text x="58" y="590" font-size="26" font-weight="400" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Statement 26 / 400, with a</text><text x="58" y="628" font-size="16" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Body 16 / 500 · muted text #40403b</text><text x="58" y="660" font-size="11" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="1">LABEL 11 / 700 · UPPERCASE · +1 PX TRACKING</text><rect x="476" y="578" width="350" height="14" rx="0" fill="#c8f53c" /><text x="476" y="590" font-size="26" font-weight="800" fill="#0d0d0d" text-anchor="start" letter-spacing="0" font-style="italic">bold-italic highlighted phrase</text><text x="58" y="730" font-size="13" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="2">BUTTONS AND FIELDS</text><rect x="61" y="759" width="154" height="42" rx="0" fill="#0d0d0d" /><rect x="58" y="756" width="154" height="42" rx="0" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="2" /><text x="135.0" y="782.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">PRIMARY ACTION</text><rect x="291" y="759" width="111" height="42" rx="0" fill="#0d0d0d" /><rect x="288" y="756" width="111" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="343.5" y="782.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">SECONDARY</text><rect x="458" y="756" width="130" height="42" rx="0" fill="#e8e8e1" stroke="rgba(13,13,13,.35)" stroke-width="2" /><text x="523.0" y="782.0" font-size="12" font-weight="700" fill="#8a8a82" text-anchor="middle" letter-spacing="1">DISABLED</text><text x="58" y="830" font-size="13" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Primary: black, turns pink on hover. Secondary: white, turns lime on hover. Press moves the button onto its shadow.</text><text x="58" y="862" font-size="11" font-weight="700" fill="#40403b" text-anchor="start" letter-spacing="1">TEXT FIELD</text><rect x="58" y="870" width="320" height="44" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="72" y="897.0" font-size="15" font-weight="500" fill="#777770" text-anchor="start" letter-spacing="0">Search by freelancer name…</text><text x="418" y="862" font-size="11" font-weight="700" fill="#40403b" text-anchor="start" letter-spacing="1">SELECT</text><rect x="418" y="870" width="220" height="44" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="432" y="897.0" font-size="15" font-weight="500" fill="#777770" text-anchor="start" letter-spacing="0">All statuses</text><text x="614" y="897.0" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">▾</text><rect x="698" y="880" width="84" height="22" rx="0" fill="#c8f53c" stroke="#0d0d0d" stroke-width="2" /><text x="740.0" y="895" font-size="10" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">AVAILABLE</text><rect x="818" y="880" width="47" height="22" rx="0" fill="#ffd9e4" stroke="#a10f3e" stroke-width="2" /><text x="841.5" y="895" font-size="10" font-weight="700" fill="#a10f3e" text-anchor="middle" letter-spacing="1">BUSY</text><rect x="908" y="874" width="32" height="32" rx="0" fill="#c8f53c" stroke="#0d0d0d" stroke-width="2" /><text x="924.0" y="894.0" font-size="11" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="0">AT</text><text x="698" y="940" font-size="13" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Badge · Badge · Avatar</text><text x="58" y="1000" font-size="13" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="2">NAVIGATION AND TABS</text><rect x="56" y="1032" width="70" height="10" rx="0" fill="#c8f53c" /><text x="58" y="1041" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="1">BROWSE</text><text x="178" y="1041" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">FUND A GIG</text><text x="298" y="1041" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">ESCROW AUDIT</text><text x="448" y="1041" font-size="13" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Active link: lime highlighter. Tabs use the same treatment.</text><text x="58" y="1100" font-size="13" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="2">PANELS</text><rect x="58" y="1118" width="300" height="120" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="78" y="1150" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Beige panel</text><rect x="398" y="1118" width="300" height="120" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="418" y="1150" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Table row area</text><line x1="398" y1="1190" x2="698" y2="1190" stroke="rgba(13,13,13,.28)" stroke-width="2"/><rect x="738" y="1118" width="300" height="120" rx="0" fill="rgba(200,245,60,.3)" stroke="#0d0d0d" stroke-width="2" /><text x="758" y="1150" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Notice (lime)</text><rect x="1078" y="1118" width="300" height="120" rx="0" fill="#ffd9e4" stroke="#a10f3e" stroke-width="2" /><text x="1098" y="1150" font-size="16" font-weight="700" fill="#a10f3e" text-anchor="start" letter-spacing="0">Error (pink)</text><text x="58" y="1300" font-size="13" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="2">LAYOUT</text><text x="58" y="1334" font-size="15" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">≥ 1000 px</text><text x="198" y="1334" font-size="15" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Three-column cards, facts beside statement, full navigation row.</text><text x="58" y="1364" font-size="15" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">760–1000 px</text><text x="198" y="1364" font-size="15" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Two-column cards, facts above statement in four columns.</text><text x="58" y="1394" font-size="15" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">&lt; 760 px</text><text x="198" y="1394" font-size="15" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Single column, horizontally scrolling navigation, stacked summary figures.</text><circle cx="1360" cy="90" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="1360" y="95" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><circle cx="878" cy="250" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="878" y="255" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><circle cx="338" cy="1130" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="338" y="1135" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><circle cx="1360" cy="1350" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="1360" y="1355" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">4</text><rect width="1440" height="1470" fill="none" stroke="#0d0d0d" stroke-width="2"/></g><text x="1520" y="90" font-size="15" font-weight="800" letter-spacing="2" fill="#0d0d0d">NOTES</text><circle cx="1534" cy="117" r="14" fill="#f2336b"/><text x="1534" y="122" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1558" y="122" font-size="14" fill="#0d0d0d">Flat off-white paper. Black text and 2</text><text x="1558" y="141" font-size="14" fill="#0d0d0d">px borders everywhere; no gradients, no</text><text x="1558" y="160" font-size="14" fill="#0d0d0d">shadows except the hard button shadow.</text><circle cx="1534" cy="196" r="14" fill="#f2336b"/><text x="1534" y="201" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1558" y="201" font-size="14" fill="#0d0d0d">Pink and lime are accents: the top</text><text x="1558" y="220" font-size="14" fill="#0d0d0d">strip, active link, highlighter</text><text x="1558" y="239" font-size="14" fill="#0d0d0d">underline, badges, primary-button hover.</text><circle cx="1534" cy="275" r="14" fill="#f2336b"/><text x="1534" y="280" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1558" y="280" font-size="14" fill="#0d0d0d">Beige panels group related information:</text><text x="1558" y="299" font-size="14" fill="#0d0d0d">facts, summary figures, filters, cards,</text><text x="1558" y="318" font-size="14" fill="#0d0d0d">empty states, dialogs.</text><circle cx="1534" cy="354" r="14" fill="#f2336b"/><text x="1534" y="359" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1558" y="359" font-size="14" fill="#0d0d0d">Responsive: three breakpoints.</text><text x="1558" y="378" font-size="14" fill="#0d0d0d">Navigation is sticky at every width.</text></svg>