0d" stroke-width="2" /><text x="1291.0" y="949.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">↻ RETRY / REFRESH</text><text x="58" y="983" font-size="14" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Funding deducts the selected amount from your seeded balance and reserves it in a FUNDED contract. No external payment is made.</text><rect x="58" y="1015" width="653.0" height="430" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="82" y="1053" font-size="15" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="1.5">1. CHOOSE WORKER</text><text x="82" y="1081" font-size="11" font-weight="700" fill="#40403b" text-anchor="start" letter-spacing="1">FIND A FREELANCER</text><rect x="82" y="1089" width="605.0" height="44" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="96" y="1116.0" font-size="15" font-weight="500" fill="#777770" text-anchor="start" letter-spacing="0">Search freelancer names</text><rect x="85" y="1158" width="154" height="42" rx="0" fill="#0d0d0d" /><rect x="82" y="1155" width="154" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="159.0" y="1181.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">SEARCH WORKERS</text><text x="82" y="1227" font-size="11" font-weight="700" fill="#40403b" text-anchor="start" letter-spacing="1">SELECTED FREELANCER</text><rect x="82" y="1235" width="605.0" height="44" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="96" y="1262.0" font-size="15" font-weight="500" fill="#777770" text-anchor="start" letter-spacing="0">Choose a freelancer</text><text x="663.0" y="1262.0" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">▾</text><text x="82" y="1325" font-size="14" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Choose an available worker.</text><rect x="82" y="1365" width="130" height="42" rx="0" fill="#e8e8e1" stroke="rgba(13,13,13,.35)" stroke-width="2" /><text x="147.0" y="1391.0" font-size="12" font-weight="700" fill="#8a8a82" text-anchor="middle" letter-spacing="1">PREVIOUS</text><text x="384.5" y="1392" font-size="11" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">PAGE 1 OF 4</text><rect x="590.0" y="1368" width="100" height="42" rx="0" fill="#0d0d0d" /><rect x="587.0" y="1365" width="100" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="637.0" y="1391.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">NEXT</text><rect x="729.0" y="1015" width="653.0" height="430" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="753.0" y="1053" font-size="15" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="1.5">2. BUDGET &amp; REVIEW</text><text x="753.0" y="1091" font-size="15" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Client: Aarav Sharma #1</text><text x="753.0" y="1117" font-size="15" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Available balance: ₹1,000.00</text><text x="753.0" y="1151" font-size="11" font-weight="700" fill="#40403b" text-anchor="start" letter-spacing="1">BUDGET (INR)</text><rect x="753.0" y="1159" width="605.0" height="44" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="767.0" y="1186.0" font-size="15" font-weight="500" fill="#777770" text-anchor="start" letter-spacing="0">500.00</text><rect x="753.0" y="1245" width="605.0" height="90" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" stroke-dasharray="6 5"/><text x="769.0" y="1277" font-size="13" font-weight="700" fill="#40403b" text-anchor="start" letter-spacing="1">Error / success area</text><text x="769.0" y="1303" font-size="13" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Friendly message, balance before → after, audit entry id</text><rect x="61" y="1478" width="180" height="42" rx="0" fill="#0d0d0d" /><rect x="58" y="1475" width="180" height="42" rx="0" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="2" /><text x="148.0" y="1501.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">REVIEW &amp; FUND GIG</text><rect x="291" y="1478" width="188" height="42" rx="0" fill="#0d0d0d" /><rect x="288" y="1475" width="188" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="382.0" y="1501.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">CHECK MY CONTRACTS</text><rect x="849.0" y="1345" width="300" height="0.01" rx="0" fill="none" /><text x="58" y="1629" font-size="40" font-weight="300" fill="#0d0d0d" text-anchor="start" letter-spacing="-1">Fund the work.</text><rect x="333" y="1613" width="312" height="20" rx="0" fill="#c8f53c" /><text x="337" y="1629" font-size="40" font-weight="800" fill="#0d0d0d" text-anchor="start" letter-spacing="-1.5" font-style="italic">Free the talent.</text><text x="720.0" y="1685" font-size="11" font-weight="500" fill="#8a8a82" text-anchor="middle" letter-spacing="2">DEMO ACTORS · CONFIGURABLE DATABASES · NO REAL PAYMENTS OR AUTHENTICATION</text><circle cx="30" cy="915" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="30" y="920" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><circle cx="88" cy="1045" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="88" y="1050" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><circle cx="759.0" cy="1045" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="759.0" y="1050" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><circle cx="358" cy="1475" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="358" y="1480" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">4</text><circle cx="1352.0" cy="1275" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="1352.0" y="1280" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><circle cx="1352.0" cy="1335" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="1352.0" y="1340" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">6</text><rect width="1440" height="1715" fill="none" stroke="#0d0d0d" stroke-width="2"/></g><text x="1520" y="90" font-size="15" font-weight="800" letter-spacing="2" fill="#0d0d0d">NOTES</text><circle cx="1534" cy="117" r="14" fill="#f2336b"/><text x="1534" y="122" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1558" y="122" font-size="14" fill="#0d0d0d">Clients only. Other roles see an access-</text><text x="1558" y="141" font-size="14" fill="#0d0d0d">denied message.</text><circle cx="1534" cy="177" r="14" fill="#f2336b"/><text x="1534" y="182" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1558" y="182" font-size="14" fill="#0d0d0d">Step 1: search freelancers by name and</text><text x="1558" y="201" font-size="14" fill="#0d0d0d">choose an available one (paged list from</text><text x="1558" y="220" font-size="14" fill="#0d0d0d">GET /freelancers).</text><circle cx="1534" cy="256" r="14" fill="#f2336b"/><text x="1534" y="261" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1558" y="261" font-size="14" fill="#0d0d0d">Step 2: balance is shown before funding.</text><text x="1558" y="280" font-size="14" fill="#0d0d0d">Budget accepts positive amounts with up</text><text x="1558" y="299" font-size="14" fill="#0d0d0d">to two decimals.</text><circle cx="1534" cy="335" r="14" fill="#f2336b"/><text x="1534" y="340" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1558" y="340" font-size="14" fill="#0d0d0d">Review &amp; fund gig asks for confirmation,</text><text x="1558" y="359" font-size="14" fill="#0d0d0d">then calls the stored procedure fund_gig</text><text x="1558" y="378" font-size="14" fill="#0d0d0d">inside a REPEATABLE READ transaction.</text><circle cx="1534" cy="414" r="14" fill="#f2336b"/><text x="1534" y="419" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1558" y="419" font-size="14" fill="#0d0d0d">Failures keep the form filled and</text><text x="1558" y="438" font-size="14" fill="#0d0d0d">explain what went wrong: insufficient</text><text x="1558" y="457" font-size="14" fill="#0d0d0d">balance, unavailable worker, conflict.</text><circle cx="1534" cy="493" r="14" fill="#f2336b"/><text x="1534" y="498" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1558" y="498" font-size="14" fill="#0d0d0d">On success: balance before and after</text><text x="1558" y="517" font-size="14" fill="#0d0d0d">plus the new wallet_audit_logs entry</text><text x="1558" y="536" font-size="14" fill="#0d0d0d">written by the trigger.</text></svg>