<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1890 1350" width="1890" height="1350" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1890" height="1350" fill="#dcdcd3"/><text x="40" y="52" font-size="20" font-weight="700" fill="#0d0d0d">States every screen can show · Desktop 1440</text><g transform="translate(40,70)"><rect width="1440" height="1240" fill="#f6f6f2"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#f2336b" /><rect x="0" y="60" width="1440" height="4" rx="0" fill="#c8f53c" /><text x="58" y="46" font-size="40" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">GigTask</text><rect x="0" y="64" width="1440" height="76" rx="0" fill="#f6f6f2" /><line x1="0" y1="140" x2="1440" y2="140" stroke="#0d0d0d" stroke-width="2"/><text x="58" y="108" font-size="15" font-weight="800" fill="#0d0d0d" text-anchor="start" letter-spacing="0">GIGTASK®</text><rect x="194" y="108" width="55" height="10" rx="0" fill="#c8f53c" /><text x="196" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">BROWSE</text><text x="292" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">FUND A GIG</text><text x="409" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">ESCROW AUDIT</text><text x="551" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">FREELANCER ANALYTICS</text><text x="756" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">NEARBY WORKERS</text><text x="920" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">REVIEWS &amp; PORTFOLIOS</text><rect x="1141" y="101" width="244" height="40" rx="0" fill="#0d0d0d" /><rect x="1138" y="98" width="244" height="40" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="1260.0" y="123" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">CLIENT · AARAV SHARMA #1 ▾</text><text x="58" y="176" font-size="11" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="1">WORKSPACE / BROWSE · GIGTASK · WORK MARKETPLACE</text><text x="1382" y="176" font-size="11" font-weight="500" fill="#40403b" text-anchor="end" letter-spacing="1">DEMO ACTORS · API</text><text x="58" y="262" font-size="76" font-weight="300" fill="#0d0d0d" text-anchor="start" letter-spacing="-3">Browse</text><text x="1382" y="232" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="end" letter-spacing="0">Every contract, client and freelancer in one</text><text x="1382" y="250" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="end" letter-spacing="0">calm place.</text><text x="58" y="230" font-size="40" font-weight="300" fill="#0d0d0d" text-anchor="start" letter-spacing="-1">State gallery</text><text x="58" y="278" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Loading</text><rect x="58" y="290" width="642.0" height="210" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="379.0" y="374" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="middle" letter-spacing="0">Loading your workspace…</text><text x="379.0" y="420" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="0" font-style="italic">“Good work takes a moment.”</text><text x="740.0" y="278" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Empty</text><rect x="740.0" y="290" width="642.0" height="210" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="1061.0" y="374" font-size="16" font-weight="500" fill="#0d0d0d" text-anchor="middle" letter-spacing="0">No reviews yet.</text><text x="1061.0" y="420" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="0" font-style="italic">“Every big gig starts with an empty page.”</text><text x="58" y="568" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Error with retry</text><rect x="58" y="580" width="642.0" height="230" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="379.0" y="646" font-size="15" font-weight="600" fill="#a10f3e" text-anchor="middle" letter-spacing="0">A database is unavailable. Check the backend connection and retry.</text><rect x="232.0" y="679" width="100" height="42" rx="0" fill="#0d0d0d" /><rect x="229.0" y="676" width="100" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="279.0" y="702.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">RETRY</text><rect x="352.0" y="679" width="150" height="42" rx="0" fill="#0d0d0d" /><rect x="349.0" y="676" width="150" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="424.0" y="702.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">GO TO BROWSE</text><text x="379.0" y="756" font-size="15" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="0" font-style="italic">“Even great gigs hit a snag. Retry and carry on.”</text><text x="740.0" y="568" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Access denied</text><rect x="740.0" y="580" width="642.0" height="230" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="1061.0" y="664" font-size="15" font-weight="600" fill="#a10f3e" text-anchor="middle" letter-spacing="0">Access denied. This page is not available for the selected role.</text><rect x="994.0" y="699" width="150" height="42" rx="0" fill="#0d0d0d" /><rect x="991.0" y="696" width="150" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="1066.0" y="722.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">GO TO BROWSE</text><text x="58" y="890" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Notices</text><rect x="58" y="906" width="642.0" height="56" rx="0" fill="rgba(200,245,60,.3)" stroke="#0d0d0d" stroke-width="2" /><text x="78" y="940" font-size="15" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Earnings refreshed. Snapshot time updated.</text><rect x="740.0" y="906" width="642.0" height="56" rx="0" fill="#ffd9e4" stroke="#a10f3e" stroke-width="2" /><text x="760.0" y="940" font-size="15" font-weight="600" fill="#a10f3e" text-anchor="start" letter-spacing="0">Your saved demo actor is unavailable. Choose an actor again.</text><text x="58" y="1010" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Disabled and pending controls</text><rect x="58" y="1026" width="130" height="42" rx="0" fill="#e8e8e1" stroke="rgba(13,13,13,.35)" stroke-width="2" /><text x="123.0" y="1052.0" font-size="12" font-weight="700" fill="#8a8a82" text-anchor="middle" letter-spacing="1">PREVIOUS</text><rect x="208" y="1026" width="190" height="42" rx="0" fill="#e8e8e1" stroke="rgba(13,13,13,.35)" stroke-width="2" /><text x="303.0" y="1052.0" font-size="12" font-weight="700" fill="#8a8a82" text-anchor="middle" letter-spacing="1">FUNDING GIG…</text><text x="418" y="1053" font-size="14" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Disabled while a request runs or when there is no previous page.</text><text x="58" y="1154" font-size="40" font-weight="300" fill="#0d0d0d" text-anchor="start" letter-spacing="-1">Small tasks.</text><rect x="284" y="1138" width="291" height="20" rx="0" fill="#c8f53c" /><text x="288" y="1154" font-size="40" font-weight="800" fill="#0d0d0d" text-anchor="start" letter-spacing="-1.5" font-style="italic">Big momentum.</text><text x="720.0" y="1210" font-size="11" font-weight="500" fill="#8a8a82" text-anchor="middle" letter-spacing="2">DEMO ACTORS · CONFIGURABLE DATABASES · NO REAL PAYMENTS OR AUTHENTICATION</text><circle cx="28" cy="300" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="28" y="305" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><circle cx="676.0" cy="300" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="676.0" y="305" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><circle cx="1352.0" cy="590" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="1352.0" y="595" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><rect width="1440" height="1240" fill="none" stroke="#0d0d0d" stroke-width="2"/></g><text x="1520" y="90" font-size="15" font-weight="800" letter-spacing="2" fill="#0d0d0d">NOTES</text><circle cx="1534" cy="117" r="14" fill="#f2336b"/><text x="1534" y="122" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1558" y="122" font-size="14" fill="#0d0d0d">Every screen handles loading, empty and</text><text x="1558" y="141" font-size="14" fill="#0d0d0d">error: no blank pages.</text><circle cx="1534" cy="177" r="14" fill="#f2336b"/><text x="1534" y="182" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1558" y="182" font-size="14" fill="#0d0d0d">Short GigTask quotes keep these states</text><text x="1558" y="201" font-size="14" fill="#0d0d0d">friendly. The retry button re-runs the</text><text x="1558" y="220" font-size="14" fill="#0d0d0d">failed request.</text><circle cx="1534" cy="256" r="14" fill="#f2336b"/><text x="1534" y="261" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1558" y="261" font-size="14" fill="#0d0d0d">Access-denied and expired-actor states</text><text x="1558" y="280" font-size="14" fill="#0d0d0d">point the user back to a valid page or</text><text x="1558" y="299" font-size="14" fill="#0d0d0d">to the actor selector.</text></svg>