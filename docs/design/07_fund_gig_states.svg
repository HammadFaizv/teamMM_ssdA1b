<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1890 1460" width="1890" height="1460" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1890" height="1460" fill="#dcdcd3"/><text x="40" y="52" font-size="20" font-weight="700" fill="#0d0d0d">Fund a gig · confirmation and result states · Desktop 1440</text><g transform="translate(40,70)"><rect width="1440" height="1350" fill="#f6f6f2"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#f2336b" /><rect x="0" y="60" width="1440" height="4" rx="0" fill="#c8f53c" /><text x="58" y="46" font-size="40" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">GigTask</text><rect x="0" y="64" width="1440" height="76" rx="0" fill="#f6f6f2" /><line x1="0" y1="140" x2="1440" y2="140" stroke="#0d0d0d" stroke-width="2"/><text x="58" y="108" font-size="15" font-weight="800" fill="#0d0d0d" text-anchor="start" letter-spacing="0">GIGTASK®</text><text x="196" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">BROWSE</text><rect x="290" y="108" width="90" height="10" rx="0" fill="#c8f53c" /><text x="292" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">FUND A GIG</text><text x="409" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">ESCROW AUDIT</text><text x="551" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">FREELANCER ANALYTICS</text><text x="756" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">NEARBY WORKERS</text><text x="920" y="117" font-size="12" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="1">REVIEWS &amp; PORTFOLIOS</text><rect x="1141" y="101" width="244" height="40" rx="0" fill="#0d0d0d" /><rect x="1138" y="98" width="244" height="40" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="1260.0" y="123" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">CLIENT · AARAV SHARMA #1 ▾</text><text x="58" y="176" font-size="11" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="1">WORKSPACE / FUND A GIG · GIGTASK · WORK MARKETPLACE</text><text x="1382" y="176" font-size="11" font-weight="500" fill="#40403b" text-anchor="end" letter-spacing="1">DEMO ACTORS · API</text><text x="58" y="262" font-size="76" font-weight="300" fill="#0d0d0d" text-anchor="start" letter-spacing="-3">Fund a gig</text><text x="1382" y="232" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="end" letter-spacing="0">Reserve the budget, start the work.</text><text x="58" y="330" font-size="18" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">A. Confirmation (browser confirm dialog)</text><rect x="66" y="358" width="520" height="190" rx="0" fill="#0d0d0d" /><rect x="58" y="350" width="520" height="190" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="82" y="390" font-size="14" font-weight="700" fill="#40403b" text-anchor="start" letter-spacing="0">localhost:5173 says</text><text x="82" y="428" font-size="15" font-weight="500" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Fund ₹500.00 to Rohan Patil? ₹500.00 is deducted</text><text x="82" y="450" font-size="15" font-weight="500" fill="#0d0d0d" text-anchor="start" letter-spacing="0">from your balance and reserved in a FUNDED contract.</text><rect x="351" y="483" width="100" height="42" rx="0" fill="#0d0d0d" /><rect x="348" y="480" width="100" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="398.0" y="506.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">CANCEL</text><rect x="471" y="483" width="84" height="42" rx="0" fill="#0d0d0d" /><rect x="468" y="480" width="84" height="42" rx="0" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="2" /><text x="510.0" y="506.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">OK</text><text x="740.0" y="330" font-size="18" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">B. Success</text><rect x="740.0" y="350" width="642.0" height="150" rx="0" fill="#c8f53c" stroke="#0d0d0d" stroke-width="2" /><text x="764.0" y="392" font-size="16" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Gig funded. Contract #62 is FUNDED.</text><text x="764.0" y="422" font-size="15" font-weight="500" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Balance ₹1,000.00 → ₹500.00</text><text x="764.0" y="450" font-size="14" font-weight="500" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Audit entry #121,002 · ESCROW HOLD · −₹500.00 · balance after ₹500.00</text><rect x="767.0" y="465" width="160" height="34" rx="0" fill="#0d0d0d" /><rect x="764.0" y="462" width="160" height="34" rx="0" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="2" /><text x="844.0" y="484.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">OPEN CONTRACT</text><text x="58" y="620" font-size="18" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">C. Failure: insufficient balance (form input kept)</text><rect x="58" y="640" width="642.0" height="120" rx="0" fill="#ffd9e4" stroke="#a10f3e" stroke-width="2" /><text x="82" y="682" font-size="15" font-weight="700" fill="#a10f3e" text-anchor="start" letter-spacing="0">Insufficient balance. Available balance is 1000.00 INR.</text><text x="82" y="712" font-size="14" font-weight="500" fill="#a10f3e" text-anchor="start" letter-spacing="0">Your selected freelancer and budget are still filled in.</text><text x="740.0" y="620" font-size="18" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">D. Failure: freelancer already has an active contract</text><rect x="740.0" y="640" width="642.0" height="120" rx="0" fill="#ffd9e4" stroke="#a10f3e" stroke-width="2" /><text x="764.0" y="682" font-size="15" font-weight="700" fill="#a10f3e" text-anchor="start" letter-spacing="0">This freelancer already has an in progress contract.</text><text x="764.0" y="712" font-size="14" font-weight="500" fill="#a10f3e" text-anchor="start" letter-spacing="0">Complete it before starting another. (partial unique index idx_active_gig)</text><text x="58" y="840" font-size="18" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">E. While saving</text><rect x="58" y="862" width="200" height="42" rx="0" fill="#e8e8e1" stroke="rgba(13,13,13,.35)" stroke-width="2" /><text x="158.0" y="888.0" font-size="12" font-weight="700" fill="#8a8a82" text-anchor="middle" letter-spacing="1">FUNDING GIG…</text><text x="288" y="889" font-size="14" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Controls are disabled while the request runs; the same idempotency key is reused on retry.</text><text x="58" y="980" font-size="18" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">F. Leaving with unsaved input</text><rect x="66" y="1000" width="520" height="130" rx="0" fill="#0d0d0d" /><rect x="58" y="992" width="520" height="130" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="82" y="1040" font-size="15" font-weight="500" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Leave this funding form and discard your changes?</text><rect x="351" y="1063" width="100" height="42" rx="0" fill="#0d0d0d" /><rect x="348" y="1060" width="100" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="398.0" y="1086.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">CANCEL</text><rect x="471" y="1063" width="84" height="42" rx="0" fill="#0d0d0d" /><rect x="468" y="1060" width="84" height="42" rx="0" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="2" /><text x="510.0" y="1086.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">OK</text><text x="58" y="1264" font-size="40" font-weight="300" fill="#0d0d0d" text-anchor="start" letter-spacing="-1">Fund the work.</text><rect x="333" y="1248" width="312" height="20" rx="0" fill="#c8f53c" /><text x="337" y="1264" font-size="40" font-weight="800" fill="#0d0d0d" text-anchor="start" letter-spacing="-1.5" font-style="italic">Free the talent.</text><text x="720.0" y="1320" font-size="11" font-weight="500" fill="#8a8a82" text-anchor="middle" letter-spacing="2">DEMO ACTORS · CONFIGURABLE DATABASES · NO REAL PAYMENTS OR AUTHENTICATION</text><rect width="1440" height="1350" fill="none" stroke="#0d0d0d" stroke-width="2"/></g><text x="1520" y="90" font-size="15" font-weight="800" letter-spacing="2" fill="#0d0d0d">NOTES</text><circle cx="1534" cy="117" r="14" fill="#f2336b"/><text x="1534" y="122" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1558" y="122" font-size="14" fill="#0d0d0d">The page chrome is the same as the Fund</text><text x="1558" y="141" font-size="14" fill="#0d0d0d">screen; only the form area changes</text><text x="1558" y="160" font-size="14" fill="#0d0d0d">between these states.</text><circle cx="1534" cy="196" r="14" fill="#f2336b"/><text x="1534" y="201" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1558" y="201" font-size="14" fill="#0d0d0d">Every message comes from the API: 400</text><text x="1558" y="220" font-size="14" fill="#0d0d0d">validation, 404 missing record, 409</text><text x="1558" y="239" font-size="14" fill="#0d0d0d">business or database conflict.</text><circle cx="1534" cy="275" r="14" fill="#f2336b"/><text x="1534" y="280" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1558" y="280" font-size="14" fill="#0d0d0d">Nothing is lost on failure. The balance</text><text x="1558" y="299" font-size="14" fill="#0d0d0d">shown after a failure is re-read from</text><text x="1558" y="318" font-size="14" fill="#0d0d0d">the database.</text></svg>