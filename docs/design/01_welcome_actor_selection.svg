<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1890 1376" width="1890" height="1376" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1890" height="1376" fill="#dcdcd3"/><text x="40" y="52" font-size="20" font-weight="700" fill="#0d0d0d">Welcome and actor selection · Desktop 1440</text><g transform="translate(40,70)"><rect width="1440" height="1266" fill="#f6f6f2"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#f2336b" /><rect x="0" y="60" width="1440" height="4" rx="0" fill="#c8f53c" /><text x="58" y="46" font-size="40" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">GigTask</text><rect x="0" y="64" width="1440" height="76" rx="0" fill="#f6f6f2" /><line x1="0" y1="140" x2="1440" y2="140" stroke="#0d0d0d" stroke-width="2"/><text x="58" y="108" font-size="15" font-weight="800" fill="#0d0d0d" text-anchor="start" letter-spacing="0">GIGTASK®</text><rect x="1214" y="101" width="171" height="40" rx="0" fill="#0d0d0d" /><rect x="1211" y="98" width="171" height="40" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="1296.5" y="123" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">CHOOSE DEMO ACTOR</text><text x="58" y="176" font-size="11" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="1">WORKSPACE / WELCOME · GIGTASK · WORK MARKETPLACE</text><text x="1382" y="176" font-size="11" font-weight="500" fill="#40403b" text-anchor="end" letter-spacing="1">DEMO ACTORS · API</text><text x="58" y="262" font-size="76" font-weight="300" fill="#0d0d0d" text-anchor="start" letter-spacing="-3">Welcome to GigTask</text><text x="1382" y="232" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="end" letter-spacing="0">GigTask is a marketplace built around one</text><text x="1382" y="250" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="end" letter-spacing="0">simple idea: find the work, fund it fairly,</text><text x="1382" y="268" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="end" letter-spacing="0">finish it with confidence.</text><rect x="58" y="350" width="240" height="320" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="82" y="386" font-size="11" font-weight="600" fill="#40403b" text-anchor="start" letter-spacing="1.5">ACTOR</text><text x="82" y="412" font-size="20" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Not chosen</text><text x="82" y="459" font-size="11" font-weight="600" fill="#40403b" text-anchor="start" letter-spacing="1.5">ROLE</text><text x="82" y="485" font-size="20" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="0">—</text><text x="82" y="532" font-size="11" font-weight="600" fill="#40403b" text-anchor="start" letter-spacing="1.5">SCOPE</text><text x="82" y="558" font-size="20" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Welcome</text><text x="82" y="605" font-size="11" font-weight="600" fill="#40403b" text-anchor="start" letter-spacing="1.5">YEAR</text><text x="82" y="631" font-size="20" font-weight="600" fill="#0d0d0d" text-anchor="start" letter-spacing="0">2026</text><rect x="384" y="372" width="900" height="15" rx="3" fill="#cfcfc6" /><rect x="384" y="406" width="930" height="15" rx="3" fill="#cfcfc6" /><rect x="384" y="440" width="760" height="15" rx="3" fill="#cfcfc6" /><rect x="520" y="445" width="300" height="12" rx="2" fill="#c8f53c" /><text x="58" y="816" font-size="30" font-weight="500" fill="#0d0d0d" text-anchor="start" letter-spacing="-0.5">Browse</text><rect x="1203" y="791" width="182" height="42" rx="0" fill="#0d0d0d" /><rect x="1200" y="788" width="182" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="1291.0" y="814.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">↻ RETRY / REFRESH</text><rect x="58" y="852" width="1324" height="210" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="720.0" y="926" font-size="15" font-weight="500" fill="#0d0d0d" text-anchor="middle" letter-spacing="0">Choose a role and seeded actor to enter your workspace.</text><rect x="623.0" y="949" width="200" height="42" rx="0" fill="#0d0d0d" /><rect x="620.0" y="946" width="200" height="42" rx="0" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="2" /><text x="720.0" y="972.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">CHOOSE DEMO ACTOR</text><text x="720.0" y="1026" font-size="15" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="0" font-style="italic">“Even the longest task list started with nothing.”</text><text x="58" y="1180" font-size="40" font-weight="300" fill="#0d0d0d" text-anchor="start" letter-spacing="-1">Find the work. Do the work.</text><rect x="556" y="1164" width="432" height="20" rx="0" fill="#c8f53c" /><text x="560" y="1180" font-size="40" font-weight="800" fill="#0d0d0d" text-anchor="start" letter-spacing="-1.5" font-style="italic">Get paid for the work.</text><text x="720.0" y="1236" font-size="11" font-weight="500" fill="#8a8a82" text-anchor="middle" letter-spacing="2">DEMO ACTORS · CONFIGURABLE DATABASES · NO REAL PAYMENTS OR AUTHENTICATION</text><rect x="0" y="0" width="1440" height="1266" fill="rgba(13,13,13,.58)"/><rect x="418" y="198" width="620" height="640" rx="0" fill="#0d0d0d" /><rect x="410" y="190" width="620" height="640" rx="0" fill="#efe6d1" stroke="#0d0d0d" stroke-width="2" /><text x="436" y="236" font-size="26" font-weight="500" fill="#0d0d0d" text-anchor="start" letter-spacing="0">Choose your demo actor</text><rect x="974" y="210" width="34" height="32" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="991" y="232" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="0">✕</text><text x="436" y="276" font-size="14" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Switch existing records without registering or logging in.</text><text x="436" y="298" font-size="14" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">Admin can inspect records but cannot change them.</text><text x="436" y="324" font-size="11" font-weight="700" fill="#40403b" text-anchor="start" letter-spacing="1">ROLE</text><rect x="436" y="332" width="568" height="44" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="450" y="359.0" font-size="15" font-weight="500" fill="#777770" text-anchor="start" letter-spacing="0">Select your role</text><text x="980" y="359.0" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">▾</text><text x="436" y="410" font-size="12" font-weight="500" fill="#40403b" text-anchor="start" letter-spacing="0">(Client / Freelancer / Admin · read only)</text><text x="436" y="432" font-size="11" font-weight="700" fill="#40403b" text-anchor="start" letter-spacing="1">FIND A DEMO ACTOR</text><rect x="436" y="440" width="458" height="44" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="450" y="467.0" font-size="15" font-weight="500" fill="#777770" text-anchor="start" letter-spacing="0">Search seeded names</text><rect x="907" y="457" width="100" height="42" rx="0" fill="#0d0d0d" /><rect x="904" y="454" width="100" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="954.0" y="480.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">SEARCH</text><text x="436" y="526" font-size="11" font-weight="700" fill="#40403b" text-anchor="start" letter-spacing="1">CHOOSE AN ACTOR</text><rect x="436" y="534" width="568" height="44" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="450" y="561.0" font-size="15" font-weight="500" fill="#777770" text-anchor="start" letter-spacing="0">Aarav Sharma</text><text x="980" y="561.0" font-size="14" font-weight="700" fill="#0d0d0d" text-anchor="start" letter-spacing="0">▾</text><rect x="436" y="602" width="130" height="38" rx="0" fill="#e8e8e1" stroke="rgba(13,13,13,.35)" stroke-width="2" /><text x="501.0" y="626.0" font-size="12" font-weight="700" fill="#8a8a82" text-anchor="middle" letter-spacing="1">← PREVIOUS</text><text x="720.0" y="627" font-size="11" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">PAGE 1 OF 4</text><rect x="907" y="605" width="100" height="38" rx="0" fill="#0d0d0d" /><rect x="904" y="602" width="100" height="38" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="954.0" y="626.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">NEXT →</text><text x="436" y="690" font-size="13" font-weight="500" fill="#a10f3e" text-anchor="start" letter-spacing="0">Error / status line</text><rect x="439" y="723" width="130" height="42" rx="0" fill="#0d0d0d" /><rect x="436" y="720" width="130" height="42" rx="0" fill="#0d0d0d" stroke="#0d0d0d" stroke-width="2" /><text x="501.0" y="746.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">CONTINUE</text><rect x="589" y="723" width="206" height="42" rx="0" fill="#0d0d0d" /><rect x="586" y="720" width="206" height="42" rx="0" fill="#fff" stroke="#0d0d0d" stroke-width="2" /><text x="689.0" y="746.0" font-size="12" font-weight="700" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">RETRY LOADING ACTORS</text><circle cx="550" cy="330" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="550" y="335" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><circle cx="990" cy="276" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="990" y="281" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><circle cx="990" cy="530" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="990" y="535" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><circle cx="28" cy="880" r="14" fill="#f2336b" stroke="#fff" stroke-width="2"/><text x="28" y="885" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">4</text><rect width="1440" height="1266" fill="none" stroke="#0d0d0d" stroke-width="2"/></g><text x="1520" y="90" font-size="15" font-weight="800" letter-spacing="2" fill="#0d0d0d">NOTES</text><circle cx="1534" cy="117" r="14" fill="#f2336b"/><text x="1534" y="122" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1558" y="122" font-size="14" fill="#0d0d0d">No real login. The demo actor selector</text><text x="1558" y="141" font-size="14" fill="#0d0d0d">replaces it: pick Client, Freelancer or</text><text x="1558" y="160" font-size="14" fill="#0d0d0d">Admin (read only).</text><circle cx="1534" cy="196" r="14" fill="#f2336b"/><text x="1534" y="201" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1558" y="201" font-size="14" fill="#0d0d0d">The choice is saved in the browser.</text><text x="1558" y="220" font-size="14" fill="#0d0d0d">Direct links are still checked by the</text><text x="1558" y="239" font-size="14" fill="#0d0d0d">server for role and ownership.</text><circle cx="1534" cy="275" r="14" fill="#f2336b"/><text x="1534" y="280" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1558" y="280" font-size="14" fill="#0d0d0d">Actor list is paged and searchable by</text><text x="1558" y="299" font-size="14" fill="#0d0d0d">name; Retry appears if loading fails.</text><circle cx="1534" cy="335" r="14" fill="#f2336b"/><text x="1534" y="340" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1558" y="340" font-size="14" fill="#0d0d0d">Behind the dialog: the welcome state</text><text x="1558" y="359" font-size="14" fill="#0d0d0d">with a quote and a button to reopen the</text><text x="1558" y="378" font-size="14" fill="#0d0d0d">selector.</text></svg>